# Single source of truth for dependency and plugin versions across all Gradle
# modules. Notably, kotlin-stdlib / kotlinx-serialization-json here are the same
# entries reticle-core and the reticle-agent injectable dex payload both use, so
# the payload can no longer drift from what reticle-core links at runtime.
[versions]
kotlin = "2.0.21"
agp = "8.7.3"
kotlinxSerialization = "1.7.3"
androidxAnnotation = "1.9.1"
androidxAppcompat = "1.7.0"
lottie = "6.6.6"
composeUi = "1.7.5"
composeMaterial3 = "1.3.1"
androidxActivity = "1.9.3"
androidxRecyclerview = "1.3.2"
jsonSchemaValidator = "1.5.2"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
