name: SampleAppIOS
options:
  bundleIdPrefix: dev.reticle
  deploymentTarget:
    iOS: "15.0"
packages:
  ReticleAgentIOS:
    path: ../../reticle-agent/ios
  # Mirrors sample-app-ios/Package.swift: the native-lottie scenarios need the
  # real Lottie view, so the device project must carry the same dependency the
  # SwiftPM (simulator) build does.
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: 4.5.0
targets:
  SampleApp:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/SampleApp
    dependencies:
      - package: ReticleAgentIOS
        product: ReticleKit
      - package: Lottie
        product: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reticle.sampleios
        # No DEVELOPMENT_TEAM here on purpose: a device build needs YOUR team, so
        # pass it on the command line (`xcodebuild DEVELOPMENT_TEAM=<id>`, which
        # scripts/e2e-ios-device.sh does from its first argument). A checked-in id
        # would be someone else's and only misleads.
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        # SwiftPM synthesizes `Bundle.module`; an Xcode app target does not, and
        # its resources land in the app bundle itself. The flag switches on the
        # shim in BundleModuleShim.swift.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: RETICLE_XCODE_APP
        TARGETED_DEVICE_FAMILY: "1,2"
  # Holds the automation BASELINE test — the known-good probe you run first when
  # the system channel misbehaves, to tell "the code broke" from "the device
  # broke". Not part of the shipping tool; see AutomationBaselineTests.swift for
  # why it earns its place.
  SampleAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../Tests/SampleAppUITests
    dependencies:
      - target: SampleApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reticle.sampleios.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: SampleApp
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  SampleAppUITests:
    build:
      targets:
        SampleApp: all
        SampleAppUITests: [test]
    test:
      targets:
        - SampleAppUITests
