# Real text layout, which is the whole point of these tests.
#
# Robolectric's default graphics mode fakes text metrics: every glyph is one unit
# wide, `getPrimaryHorizontal` returns nonsense and nothing ever wraps — so a
# suite written against it would assert the fake and pass while `RegionProbe`
# produced garbage rects on a device. NATIVE runs the real Skia/minikin stack, so
# `android.text.Layout` measures text the way the device does (measured: the same
# string wraps to 3 lines here and 1 line under the default).
#
# sdk: the newest level Robolectric ships images for that this build targets.
# Native graphics needs a modern level; the agent's minSdk (24) predates it.
graphicsMode=NATIVE
sdk=34
